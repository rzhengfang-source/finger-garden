<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Finger Garden</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #app{position:fixed;inset:0;overflow:hidden;background:#000}
  #camera{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scaleX(-1);background:#000}
  #three{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #hud{position:absolute;inset:0;pointer-events:none}
  #status{position:absolute;left:18px;bottom:18px;padding:9px 13px;border-radius:999px;background:#0007;color:#fff;font-size:12px;backdrop-filter:blur(10px)}
  #magic{position:absolute;top:10%;left:50%;transform:translate(-50%,-12px);text-align:center;color:white;opacity:0;transition:.5s ease;text-shadow:0 2px 18px #0009;letter-spacing:.02em}
  #magic.show{opacity:1;transform:translate(-50%,0)}
  #magic .a{font:600 clamp(22px,4vw,48px)/1.05 Georgia,serif}
  #magic .b{margin-top:8px;font-size:clamp(13px,1.5vw,18px);letter-spacing:.14em;text-transform:lowercase}
  .tip{position:absolute;transform:translate(-50%,-50%);font-size:clamp(24px,3vw,38px);filter:drop-shadow(0 2px 4px #0008);will-change:left,top;transition:opacity .12s}
  .plant{position:absolute;left:0;top:0;transform-origin:50% 100%;will-change:transform,opacity;filter:drop-shadow(0 3px 4px #0005)}
  .plant .stem{position:absolute;left:50%;bottom:7px;width:4px;height:var(--stem);background:linear-gradient(#6fa85c,#315f35);border-radius:4px;transform:translateX(-50%) scaleY(0);transform-origin:bottom;transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
  .plant .leaf{position:absolute;bottom:calc(var(--stem)*.42);font-size:calc(var(--size)*.45);opacity:0;transform:scale(.1) rotate(-25deg);transition:1s ease}
  .plant .leaf.l{right:49%}.plant .leaf.r{left:49%;transform:scale(.1) rotate(25deg)}
  .plant .flower{position:absolute;left:50%;bottom:calc(var(--stem) - 10px);font-size:var(--size);transform:translateX(-50%) scale(0) rotate(-10deg);opacity:0;transition:1.2s cubic-bezier(.2,1.4,.4,1)}
  .plant .seed{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:calc(var(--size)*.24);transition:.6s ease}
  .plant.sprout .stem{transform:translateX(-50%) scaleY(1)}
  .plant.leafy .leaf{opacity:1;transform:scale(1) rotate(-25deg)} .plant.leafy .leaf.r{transform:scale(1) rotate(25deg)}
  .plant.bloom .flower{opacity:1;transform:translateX(-50%) scale(1) rotate(0)} .plant.bloom .seed{opacity:0}
  .plant.wind{transition:transform 1.8s cubic-bezier(.4,0,.9,.6),opacity 1.8s;transform:translate(var(--wind-x),-20vh) rotate(var(--wind-r))!important;opacity:0}
  .butterfly{position:absolute;font-size:clamp(28px,4vw,48px);animation:fly 5s cubic-bezier(.2,.65,.55,1) forwards;filter:drop-shadow(0 2px 5px #0005)}
  @keyframes fly{0%{transform:translate(-15vw,20vh) rotate(-15deg);opacity:0}10%{opacity:1}45%{transform:translate(45vw,-12vh) rotate(8deg)}100%{transform:translate(115vw,-35vh) rotate(-8deg);opacity:0}}
  #start{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#243b2b,#07100a 70%);z-index:20}
  #start button{border:1px solid #ffffff55;background:#ffffff16;color:white;padding:15px 24px;border-radius:999px;font-size:16px;cursor:pointer;backdrop-filter:blur(10px)}
  #start p{color:#dfe9df;text-align:center;max-width:460px;padding:0 25px;line-height:1.5;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="three"></canvas>
  <div id="hud">
    <div id="magic"><div class="a">you created a finger garden</div><div class="b">you have magic •</div></div>
    <div id="status">waiting for camera…</div>
  </div>
  <div id="start"><div><p>Show both hands to the camera. Pinch your thumb to another fingertip to plant and play a note.</p><div style="text-align:center"><button id="startBtn">Enter the garden</button></div></div></div>
</div>

<!-- MediaPipe loaded with regular CDN script tags; globals: Hands, Camera -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<!-- Modern Three.js exposed globally as THREE -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  const video = document.querySelector('#camera');
  const canvas = document.querySelector('#three');
  const app = document.querySelector('#app');
  const statusEl = document.querySelector('#status');
  const magic = document.querySelector('#magic');
  const start = document.querySelector('#start');

  // index fingers excluding thumbs: index, middle, ring, pinky for each hand.
  const tips = [8,12,16,20];
  const flowers = {
    Left:  ['🌻','🌷','🌼','🌺'],
    Right: ['🌸','🌹','🪻','🌿']
  };
  const notes = {
    Left:  [261.63,293.66,329.63,349.23], // C D E F
    Right: [392.00,440.00,493.88,523.25]  // G A B C
  };

  // Three.js is intentionally used for a transparent full-screen overlay.
  const renderer = new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  const scene = new THREE.Scene();
  const camera3 = new THREE.OrthographicCamera(-1,1,1,-1,0.1,10); camera3.position.z=1;
  const glowGeo = new THREE.CircleGeometry(.018,32);
  const glowMat = new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.18});
  const pinchGlow = new THREE.Mesh(glowGeo,glowMat); scene.add(pinchGlow); pinchGlow.visible=false;
  function resize(){ renderer.setSize(innerWidth,innerHeight,false); }
  addEventListener('resize',resize); resize();
  (function render(){ renderer.render(scene,camera3); requestAnimationFrame(render); })();

  let audioCtx;
  function tone(freq){
    audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=freq; g.gain.setValueAtTime(.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.16,audioCtx.currentTime+.025);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.42);
    o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.45);
  }

  const tipEls = new Map(), pinched = new Map();
  function tipEl(key,emoji){
    if(!tipEls.has(key)){ const e=document.createElement('div'); e.className='tip'; app.appendChild(e); tipEls.set(key,e); }
    const e=tipEls.get(key); e.textContent=emoji; return e;
  }
  function hideTips(){ tipEls.forEach(e=>e.style.opacity=0); }

  function screenPoint(lm){
    // Video is mirrored via CSS, so x is mirrored here as well.
    return {x:(1-lm.x)*innerWidth, y:lm.y*innerHeight};
  }
  function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

  let livePlants=0, butterflyArmed=true;
  function plant(x,y,flower){
    livePlants++;
    const p=document.createElement('div'); p.className='plant';
    const size=42+Math.random()*42, stem=50+Math.random()*100;
    p.style.cssText=`left:${x}px;top:${y}px;--size:${size}px;--stem:${stem}px;transform:translate(-50%,-100%) scale(${.82+Math.random()*.45})`;
    p.innerHTML=`<span class="seed">•</span><span class="stem"></span><span class="leaf l">🍃</span><span class="leaf r">🍃</span><span class="flower">${flower}</span>`;
    app.appendChild(p);
    const grow=3000+Math.random()*2000;
    setTimeout(()=>p.classList.add('sprout'),Math.max(300,grow*.25));
    setTimeout(()=>p.classList.add('leafy'),grow*.58);
    setTimeout(()=>p.classList.add('bloom'),grow);
    const stay=5000+Math.random()*3000;
    setTimeout(()=>{
      p.style.setProperty('--wind-x',`${(Math.random()>.5?1:-1)*(45+Math.random()*80)}vw`);
      p.style.setProperty('--wind-r',`${(Math.random()-.5)*100}deg`);
      p.classList.add('wind');
      setTimeout(()=>{p.remove(); livePlants=Math.max(0,livePlants-1); if(livePlants<25) butterflyArmed=true;},1900);
    },grow+stay);
    if(livePlants>30 && butterflyArmed){ butterflyArmed=false; butterflies(); }
  }

  function butterflies(){
    magic.classList.add('show');
    for(let i=0;i<5;i++){
      const b=document.createElement('div'); b.className='butterfly'; b.textContent='🦋';
      b.style.left=`${-10-Math.random()*15}vw`; b.style.top=`${30+Math.random()*55}vh`;
      b.style.animationDelay=`${Math.random()*.55}s`; app.appendChild(b); setTimeout(()=>b.remove(),5700);
    }
    setTimeout(()=>magic.classList.remove('show'),5000);
  }

  function onResults(results){
    hideTips(); pinchGlow.visible=false;
    const seen=new Set();
    const hands=results.multiHandLandmarks||[], handed=results.multiHandedness||[];
    hands.forEach((lm,h)=>{
      // Mirroring can swap semantic handedness depending on camera pipeline; label only needs to stay internally consistent.
      const label=handed[h]?.label || (h?'Right':'Left');
      const thumb=screenPoint(lm[4]);
      tips.forEach((idx,i)=>{
        const key=`${label}-${idx}`, pt=screenPoint(lm[idx]); seen.add(key);
        const e=tipEl(key,flowers[label]?.[i]||'🌱'); e.style.left=pt.x+'px'; e.style.top=pt.y+'px'; e.style.opacity=1;
        const palm=dist(screenPoint(lm[5]),screenPoint(lm[17]));
        const threshold=Math.max(28,palm*.28);
        const isPinch=dist(thumb,pt)<threshold;
        if(isPinch && !pinched.get(key)){
          pinched.set(key,true); plant((thumb.x+pt.x)/2,(thumb.y+pt.y)/2,flowers[label]?.[i]||'🌱'); tone(notes[label]?.[i]||440);
          pinchGlow.visible=true; pinchGlow.position.set(((pt.x/innerWidth)*2-1),-((pt.y/innerHeight)*2-1),0);
        } else if(!isPinch && dist(thumb,pt)>threshold*1.45) pinched.set(key,false);
      });
    });
    [...pinched.keys()].forEach(k=>{if(!seen.has(k)) pinched.set(k,false)});
    statusEl.textContent=hands.length ? `${hands.length} hand${hands.length>1?'s':''} • ${livePlants} plants` : 'show your hands';
  }

  const hands = new Hands({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
  hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.65,minTrackingConfidence:.6});
  hands.onResults(onResults);

  async function boot(){
    start.style.display='none'; statusEl.textContent='starting camera…';
    try{
      const cam = new Camera(video,{onFrame:async()=>{await hands.send({image:video})},width:1280,height:720});
      await cam.start(); statusEl.textContent='camera ready • pinch to plant';
    }catch(err){ start.style.display='grid'; statusEl.textContent='camera permission needed'; start.querySelector('p').textContent='Camera access failed. Open this page through HTTPS or localhost and allow camera permission.'; console.error(err); }
  }
  document.querySelector('#startBtn').addEventListener('click',boot,{once:true});
})();
</script>
</body>
</html>
